<title>หอคอยโชคชะตา</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;
--bg:#0b1215;--bg2:#101b20;--panel:#15232a;--panel2:#1c2e36;--line:#2c434d;--line2:#3d5a66;
--ink:#f1e7d0;--muted:#a3b5ad;--dim:#6f857e;--gold:#f4bb4a;--gold2:#b97a22;--ember:#e86a3a;
--hp:#e0574b;--mp:#4fa6e0;--exp:#86cf6a;--luk:#5fd0a6;--atk:#f08a4b;--def:#a9bfd0;
--good:#86d67f;--bad:#ef6b5e;--warn:#f2c14e;--karma:#d7b8f0;--focus:#ffd76a;
--parch:#eadbb4;--parch2:#d4bf8c;--pink:#ea9bbd;
--fT:'Mitr','Kanit','Noto Sans Thai',system-ui,sans-serif;
--fP:'Pixelify Sans','Silkscreen','Mitr',monospace;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--fT);font-weight:300;line-height:1.5;
background:radial-gradient(ellipse 80% 40% at 50% -5%,#2a2416 0%,transparent 70%),var(--bg);min-height:100vh;overflow-x:hidden}
.wrap{max-width:1120px;margin:0 auto;padding-block:14px 28px;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.px{font-family:var(--fP);font-weight:600;letter-spacing:.02em}
h2{font-size:15px;font-weight:500;margin:0 0 8px;color:var(--gold)}
button{font-family:var(--fT);color:var(--ink);cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--panel);border:2px solid var(--line);
box-shadow:0 0 0 2px #070c0e,inset 0 2px 0 #24383f;padding:8px 12px;border-radius:4px}
.who{min-width:0;flex:1 1 180px}
.who .nm{font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .sub{font-size:12px;color:var(--muted)}
.flr{display:flex;align-items:baseline;gap:4px}
.flr .lbl{font-size:13px;color:var(--muted)}
.flr .big{font-size:26px;color:var(--gold)}
.dim{color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:3 1 420px}
.chip{position:relative;display:flex;align-items:center;gap:5px;background:var(--bg2);border:1px solid var(--line);padding:3px 7px;border-radius:3px;min-width:0}
.chip .v{font-size:13px}
.chip .bar{display:block;width:44px;height:5px;background:#0a0f11;border:1px solid #2a3a40}
.chip .bar i{display:block;height:100%;width:0;transition:width .3s}
#b-hp{background:var(--hp)}#b-mp{background:var(--mp)}#b-lv{background:var(--exp)}
canvas.ico{width:16px;height:16px;image-rendering:pixelated;flex:none}
.flt{position:absolute;left:50%;top:-4px;transform:translateX(-50%);font-family:var(--fP);font-size:12px;font-weight:700;pointer-events:none;white-space:nowrap;animation:flt 1.2s ease-out forwards;text-shadow:0 1px 0 #000}
.flt.up{color:var(--good)}.flt.dn{color:var(--bad)}
@keyframes flt{0%{opacity:0;transform:translate(-50%,4px)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-22px)}}
.prog{margin:10px 0}
.track{position:relative;height:14px;background:var(--bg2);border:2px solid var(--line);border-radius:2px}
.track .fill{position:absolute;inset:0 auto 0 0;width:0;background:repeating-linear-gradient(90deg,var(--gold2) 0 4px,var(--gold) 4px 8px);transition:width .4s}
.tick{position:absolute;top:-4px;width:2px;height:18px;background:var(--ember);transform:translateX(-1px)}
.tick.done{background:var(--good)}
.mark{position:absolute;top:-9px;width:10px;height:10px;background:var(--ink);transform:translateX(-5px) rotate(45deg);border:2px solid #000;transition:left .4s}
.prog .lg{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:3px}
.main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px;align-items:start}
.sceneBox{position:relative;background:#05080a;border:2px solid var(--line);box-shadow:0 0 0 2px #070c0e;border-radius:4px;overflow:hidden}
#scene{display:block;width:100%;aspect-ratio:3/2;image-rendering:pixelated;image-rendering:crisp-edges}
.biome{position:absolute;left:8px;top:8px;font-size:12px;background:#000a;padding:2px 8px;border-radius:2px;color:var(--gold)}
.card{background:var(--panel);border:2px solid var(--line);box-shadow:0 0 0 2px #070c0e,inset 0 2px 0 #24383f;border-radius:4px;padding:14px;min-height:200px}
.card h3{margin:0 0 4px;font-size:19px;font-weight:500;color:var(--gold)}
.card .tag{font-size:12px;color:var(--muted);margin-bottom:6px}
.card p{margin:6px 0 12px;color:var(--ink);font-size:14px}
.chs{display:flex;flex-direction:column;gap:7px}
.ch{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--panel2);border:2px solid var(--line2);border-radius:3px;padding:8px 10px;font-size:14px;transition:background .15s,border-color .15s}
.ch:hover:not(:disabled){background:#243a44;border-color:var(--gold2)}
.ch:disabled{opacity:.45;cursor:not-allowed}
.ch .k{flex:none;font-family:var(--fP);font-weight:700;background:var(--gold);color:#1a1206;width:22px;height:22px;display:grid;place-items:center;border-radius:2px;font-size:13px;margin-top:1px}
.ch .t{font-weight:500}
.ch .s{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.ch.pri{border-color:var(--gold2);background:#2a2a1c}
.g{color:var(--good)}.b{color:var(--bad)}.w{color:var(--warn)}.kk{color:var(--karma)}
.msgs{list-style:none;margin:6px 0 12px;padding:0;font-size:14px}
.msgs li{padding:3px 0;border-bottom:1px dashed #2a3e46}
.msgs li.good{color:var(--good)}.msgs li.bad{color:var(--bad)}.msgs li.lv{color:var(--gold)}.msgs li.info{color:var(--ink)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:8px 0}
.vs .side{background:var(--bg2);border:1px solid var(--line);padding:6px 8px;border-radius:3px;font-size:13px}
.vs .side b{font-family:var(--fP);font-size:18px;color:var(--gold)}
.hpbar{height:8px;background:#0a0f11;border:1px solid #2a3a40;margin-top:4px}
.hpbar i{display:block;height:100%;background:var(--hp);transition:width .15s}
.hpbar.e i{background:var(--ember)}
.blog{font-size:12px;color:var(--muted);min-height:70px;margin:6px 0 10px;list-style:none;padding:0}
.blog li:first-child{color:var(--ink)}
.cert{background:var(--parch);color:#33240f;border-radius:3px;padding:12px 14px;box-shadow:inset 0 0 0 3px var(--parch2),inset 0 0 0 5px #8b6a3a;position:relative}
.cert .hd{text-align:center;font-weight:600;letter-spacing:.04em;color:#6b3f12;font-size:14px;border-bottom:2px dashed #a8874f;padding-bottom:4px}
.cert .nm{text-align:center;font-size:24px;font-weight:600;margin:6px 0 0}
.cert .vil{text-align:center;font-size:13px;color:#6b5634}
.badges{display:flex;justify-content:center;gap:6px;margin:8px 0;flex-wrap:wrap}
.rk{font-family:var(--fP);font-weight:700;padding:1px 10px;border-radius:2px;color:#111;font-size:16px;border:2px solid #0004}
.cls{background:#3a2a14;color:var(--parch);padding:2px 10px;border-radius:2px;font-size:14px}
.cert .pas{font-size:12.5px;text-align:center;color:#4a3518}
.cstats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:8px 0;font-size:13px}
.cstats div{background:#d9c79a;padding:2px 6px;border-radius:2px;display:flex;justify-content:space-between}
.cstats b{font-family:var(--fP)}
.odds{text-align:center;font-size:15px;margin:4px 0}
.odds b{font-family:var(--fP);font-size:20px;color:#8a2a12}
.rchart{display:flex;align-items:flex-end;gap:4px;height:84px;margin:16px 4px 2px;border-bottom:2px solid #6b5634;position:relative}
.rchart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.rchart .bar{width:100%;background:repeating-linear-gradient(0deg,#9c8455 0 3px,#8a7346 3px 6px)}
.rchart .col.me .bar{background:repeating-linear-gradient(0deg,#c2411f 0 3px,#a8341a 3px 6px)}
.rchart .me-tag{position:absolute;top:-17px;font-size:11px;background:#a8341a;color:#fff;padding:0 4px;border-radius:2px;white-space:nowrap}
.rlab{display:flex;gap:4px;margin:0 4px}
.rlab span{flex:1;text-align:center;font-family:var(--fP);font-size:12px}
.cert .foot{text-align:center;font-size:12px;color:#6b5634;margin-top:4px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{flex:1 1 140px;background:var(--panel2);border:2px solid var(--line2);border-radius:3px;padding:9px 12px;font-size:14px;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--gold2)}
.btn.pri{background:var(--gold);color:#1a1206;border-color:#7a5214}
.btn.pri:hover:not(:disabled){background:#ffd06a}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .kb{font-family:var(--fP);font-size:11px;opacity:.7;margin-left:4px}
.lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:12px;margin-top:12px}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:4px;padding:10px 12px;min-width:0}
.mem{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed #2a3e46;font-size:13px}
.mem canvas{width:32px;height:32px;image-rendering:pixelated;background:var(--bg2);border:1px solid var(--line);flex:none}
.mem .d{color:var(--muted);font-size:12px}
.inv{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
.inv b{color:var(--ink);font-family:var(--fP)}
#log{list-style:none;margin:0;padding:0;max-height:220px;overflow:auto;font-size:13px}
#log li{padding:2px 0;border-bottom:1px solid #1d2d33;display:flex;gap:8px}
#log li .f{font-family:var(--fP);color:var(--dim);flex:none;width:34px}
#log li.good{color:var(--good)}#log li.bad{color:var(--bad)}#log li.lv{color:var(--gold)}
.memo{margin-top:12px}
.memo .row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;font-size:13px;padding:4px 0;border-bottom:1px dashed #2a3e46}
.memo .row .x{color:var(--muted);font-size:12px}
.keys{margin-top:10px;text-align:center;font-size:12px;color:var(--dim)}
.grid100{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;margin:6px 0}
.grid100 span{aspect-ratio:1;border-radius:1px;background:#1a262b;position:relative}
.grid100 span.boss{box-shadow:inset 0 0 0 1px var(--ember)}
.grid100 span.farm::after{content:"";position:absolute;right:1px;bottom:1px;width:3px;height:3px;background:#5fd0a6}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;margin-right:3px;vertical-align:-1px}
.hist{display:flex;align-items:flex-end;gap:3px;height:80px;margin-top:18px;border-bottom:2px solid var(--line2)}
.hist .c{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;position:relative}
.hist .c i{display:block;background:var(--line2)}
.hist .c.me i{background:var(--gold)}
.hist .c .me-tag{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:11px;background:var(--gold);color:#1a1206;padding:0 4px;border-radius:2px;white-space:nowrap}
.hlab{display:flex;gap:3px;font-family:var(--fP);font-size:10px;color:var(--dim)}
.hlab span{flex:1;text-align:center}
.epi{border:2px solid var(--line2);background:var(--bg2);padding:10px;border-radius:3px;margin-bottom:10px}
.epi .big{font-size:22px;font-weight:600;color:var(--gold)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.judge{margin:8px 0;padding:8px;border-left:3px solid var(--karma);background:#1b1a24;font-size:14px}
.shopg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media (max-width:700px){
 .main,.lower{grid-template-columns:minmax(0,1fr)}
 .chips{flex-basis:100%}
 .chip .bar{width:30px}
 .shopg{grid-template-columns:1fr}
 .card{padding:12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
 <header class="hud" aria-label="สถานะนักผจญภัย">
  <div class="who"><div class="nm" id="hName">—</div><div class="sub" id="hSub"></div></div>
  <div class="flr"><span class="lbl">ชั้น</span><span class="px big" id="hFloor">0</span><span class="px dim">/100</span></div>
  <div class="chips">
   <div class="chip" id="c-hp" title="พลังชีวิต"><canvas class="ico" data-ico="heart" width="8" height="8"></canvas><span class="px v" id="v-hp"></span><span class="bar"><i id="b-hp"></i></span></div>
   <div class="chip" id="c-atk" title="พลังโจมตี"><canvas class="ico" data-ico="sword" width="8" height="8"></canvas><span class="px v" id="v-atk"></span></div>
   <div class="chip" id="c-def" title="พลังป้องกัน"><canvas class="ico" data-ico="shield" width="8" height="8"></canvas><span class="px v" id="v-def"></span></div>
   <div class="chip" id="c-luk" title="โชค"><canvas class="ico" data-ico="clover" width="8" height="8"></canvas><span class="px v" id="v-luk"></span></div>
   <div class="chip" id="c-mp" title="มานา"><canvas class="ico" data-ico="drop" width="8" height="8"></canvas><span class="px v" id="v-mp"></span><span class="bar"><i id="b-mp"></i></span></div>
   <div class="chip" id="c-lv" title="เลเวล / EXP"><canvas class="ico" data-ico="star" width="8" height="8"></canvas><span class="px v" id="v-lv"></span><span class="bar"><i id="b-lv"></i></span></div>
   <div class="chip" id="c-gold" title="เหรียญทอง"><canvas class="ico" data-ico="coin" width="8" height="8"></canvas><span class="px v" id="v-gold"></span></div>
  </div>
 </header>
 <div class="prog"><div class="track" role="progressbar" aria-label="ความคืบหน้าหอคอย" aria-valuemin="0" aria-valuemax="100" id="track"><div class="fill" id="pFill"></div><div id="pTicks"></div><div class="mark" id="pMark"></div></div>
  <div class="lg"><span class="px">1</span><span>ขีดแดง = ชั้นบอส</span><span class="px">100</span></div></div>
 <main class="main">
  <section class="sceneBox"><canvas id="scene" width="192" height="128" aria-label="ฉากในหอคอย"></canvas><div class="biome" id="biomeTag"></div></section>
  <section class="card" id="card" aria-live="polite"></section>
 </main>
 <section class="lower">
  <div class="panel"><h2>ปาร์ตี้</h2><div id="party"></div></div>
  <div class="panel"><h2>บันทึกการผจญภัย</h2><ol id="log"></ol></div>
 </section>
 <section class="panel memo"><h2>สุสานนักผจญภัย</h2><div id="memo"></div></section>
 <footer class="keys">ปุ่มลัด: 1–9 เลือก · Enter ดำเนินต่อ · F ฟาร์ม · P ดื่มยา</footer>
</div>

<script>
/*ENGINE-START*/
let rnd=Math.random;
const rr=(a,b)=>a+(b-a)*rnd(), pick=a=>a[Math.floor(rnd()*a.length)], clamp=(v,a,b)=>v<a?a:v>b?b:v;
function wIdx(ws){let s=0;for(const w of ws)s+=w;let r=rnd()*s;for(let i=0;i<ws.length;i++){r-=ws[i];if(r<0)return i;}return ws.length-1;}
const BAL={mh0:38,mh1:4.2,mh2:0.03,ma0:9,ma1:0.62,ma2:0.0045,md0:3,md1:0.3,md2:0.002,bHp:2.0,bAtk:1.18,bDef:1.1,ex0:9,ex1:2.0,g0:4,g1:1.5,regen:0.03,gr:1.5,gp:1.5};
const RANKS=[{k:'F',w:30,m:0.74,col:'#9aa0a6'},{k:'E',w:25,m:0.83,col:'#a7c48f'},{k:'D',w:18,m:0.92,col:'#6fc0a8'},{k:'C',w:13,m:1.0,col:'#74acdf'},{k:'B',w:8,m:1.1,col:'#c39be8'},{k:'A',w:4.5,m:1.22,col:'#f0a64e'},{k:'S',w:1.3,m:1.4,col:'#f6d84e'},{k:'SS',w:0.2,m:1.65,col:'#ff7a5a'}];
const CLASSES=[
{id:'war',n:'นักรบ',w:16.33,hp:120,atk:13,def:8,luk:5,mp:10,g:{hp:13,atk:2.4,def:1.6,luk:.3,mp:1},p:'เกราะเหล็ก',pd:'รับความเสียหายลดลง 12%'},
{id:'mag',n:'จอมเวท',w:16.33,hp:85,atk:17,def:4,luk:6,mp:40,g:{hp:9,atk:3,def:.9,luk:.3,mp:4},p:'ลูกไฟเปิดฉาก',pd:'สกิลเปิดการต่อสู้แรง x2.5'},
{id:'arc',n:'นักธนู',w:16.33,hp:95,atk:15,def:5,luk:9,mp:15,g:{hp:10,atk:2.7,def:1.1,luk:.5,mp:1.5},p:'ตาเหยี่ยว',pd:'คริติคอล +12% · หนีง่ายขึ้น'},
{id:'pri',n:'นักบวช',w:16.33,hp:105,atk:10,def:7,luk:7,mp:35,g:{hp:11,atk:2,def:1.4,luk:.4,mp:3.5},p:'แสงศักดิ์สิทธิ์',pd:'ฟื้น HP 6% ทุกชั้น · สกิลรักษา'},
{id:'rog',n:'โจร',w:16.33,hp:88,atk:13,def:5,luk:12,mp:15,g:{hp:9.5,atk:2.6,def:1,luk:.7,mp:1.5},p:'มือไว',pd:'ทองที่ได้ +30%'},

{id:'dra',n:'อัศวินมังกร',w:2,hp:135,atk:17,def:10,luk:8,mp:20,g:{hp:14,atk:3,def:1.8,luk:.4,mp:2},p:'เลือดมังกร',pd:'ดาเมจใส่บอส +25% · ฟื้น HP 3% ทุกชั้น'}];

const NA=['อาร์','เซล','ไค','ลิน','โร','มิ','ธอร์','เอล','วา','ริน','กา','ซี','ดา','นอ','เฟ','ยู','ไอ','บรู'],NB=['เรน','ดิส','ลอส','วิน','ริก','ซา','นอร์','เลีย','ธัส','มีร์','คัส','ฟีน','โด','น่า'];

const genName=()=>pick(NA)+pick(NB)+(rnd()<.4?pick(NB):'');

function applyFx(R,fx,out){const h=R.h,f=R.floor,s=scl(f);if(!fx)return;

function drink(R){if(R.potions<1)return false;R.potions--;R.h.hp=Math.min(R.h.mhp,R.h.hp+R.h.mhp*.45);return true;}
function climb(R){const out={msgs:[]},h=R.h,id=cid(R);R.floor++;if(R.floor>R.maxFloor)R.maxFloor=R.floor;R.farmN=0;
 const rg=BAL.regen+(id==='pri'?.06:0)+(id==='dra'?.03:0)+(hasPet(R,'slime')?.04:0);h.hp=Math.min(h.mhp,h.hp+h.mhp*rg);h.mp=Math.min(h.mmp,h.mp+h.mmp*.2);
 R.comps.forEach(c=>c.pw*=1.015);
 if(R.karma<-8)for(let i=R.comps.length-1;i>=0;i--){if(rnd()<Math.min(.1,-R.karma*.004)){const c=R.comps[i];const st=Math.round(h.gold*.25);h.gold-=st;R.comps.splice(i,1);say(R,out,`${c.n}ทรยศ! ขโมยทอง ${st} แล้วหนีไป (กรรมตามสนอง)`,'bad');}}
 return out;}
function enterShop(R){R.h.hp=Math.min(R.h.mhp,R.h.hp+R.h.mhp*.2);}
function shopList(R){const f=R.floor,h=R.h,b=R.buys,s=scl(f),inc=k=>Math.pow(1.3,b[k]||0);
 const L=[{id:'heal',n:'พักฟื้นเต็มที่',d:'ฟื้น HP และ MP จนเต็ม',cost:Math.round(8*s)},
 {id:'pot',n:'ยาฟื้นพลัง',d:'ฟื้น HP 45% (เก็บไว้ใช้)',cost:Math.round(12*s)},
 {id:'warp',n:'ม้วนวาร์ป',d:'ข้ามบอสได้ 1 ครั้ง',cost:Math.round(45*s)},
 {id:'atk',n:'ลับคมอาวุธ',d:`ATK +${(1.5+f*.1).toFixed(1)}`,cost:Math.round(28*s*inc('atk'))},
 {id:'def',n:'เสริมเกราะ',d:`DEF +${(1+f*.07).toFixed(1)}`,cost:Math.round(28*s*inc('def'))},
 {id:'mhp',n:'ยาอายุวัฒนะ',d:'HP สูงสุด +10%',cost:Math.round(32*s*inc('mhp'))},
 {id:'luk',n:'เครื่องรางนำโชค',d:'LUK +3',cost:Math.round(22*s*inc('luk'))}];
 if(h.rank<RANKS.length-1)L.push({id:'rank',n:`เลื่อนแรงค์ ${RANKS[h.rank].k}→${RANKS[h.rank+1].k}`,d:'พลังพื้นฐานทุกอย่างเพิ่มตามแรงค์',cost:Math.round((220+180*h.rank)*s*inc('rank'))});
 return L.map(x=>Object.assign(x,{dis:h.gold<x.cost||(x.id==='heal'&&h.hp>=h.mhp-.5&&h.mp>=h.mmp-.5)}));}
function buy(R,id){const it=shopList(R).find(x=>x.id===id);if(!it||it.dis)return false;const h=R.h,f=R.floor;h.gold-=it.cost;R.buys[id]=(R.buys[id]||0)+1;
 if(id==='heal'){h.hp=h.mhp;h.mp=h.mmp;R.buys.heal=0;}else if(id==='pot'){R.potions++;R.buys.pot=0;}else if(id==='warp'){R.warps++;R.buys.warp=0;}
 else if(id==='atk')h.atk+=1.5+f*.1;else if(id==='def')h.def+=1+f*.07;else if(id==='mhp'){h.mhp*=1.1;h.hp+=h.mhp*.1/1.1;}else if(id==='luk')h.luk+=3;
 else if(id==='rank'){const q=RANKS[h.rank+1].m/RANKS[h.rank].m;h.rank++;h.mhp*=q;h.hp*=q;h.atk*=q;h.def*=q;h.mmp*=q;}
 return true;}
// --- AI policy (used for the 160 simulated adventurers) ---
function aiPick(R,ev){const h=R.h,hf=h.hp/h.mhp;
 if(ev.kind==='ev'){let best=0,bs=-1e9;EVENTS[ev.ti].c.forEach((ch,i)=>{if(chDis(R,ch))return;let s=rnd();if(ch.p)s-=ch.p*(hf<.5?3:.8);
  if(ch.g&&ch.g.hp>0&&hf<.6)s+=1.2;if(ch.g&&ch.g.hp<0&&hf<.5)s-=1;if(s>bs){bs=s;best=i;}});return best;}
 if(ev.kind==='mon'){const w=estimateWin(R,ev.en,24);if(w>=.75)return 0;if(ev.en.pet&&R.pets.length<2&&w>=.5&&rnd()<.5)return 2;return 1;}
 if(ev.kind==='pet')return 0;
 if(ev.kind==='comp'){if(R.comps.length>=2)return 2;if(h.gold>=compCost(R)+20)return 0;return hf>.6?1:2;}
 if(ev.kind==='boss'){const w=estimateWin(R,ev.en,60);if(w>=.6)return 0;const cw=(R.warps>0||h.gold>=warpCost(R))&&R.floor<100;
  if(w<.35&&cw&&R.retreats>=2)return 1;if(R.retreats<4)return 2;if(cw)return 1;return 0;}
 return 0;}
function aiPotion(R){if(R.h.hp/R.h.mhp<.45)drink(R);}
function aiShop(R){const h=R.h;if(h.hp<h.mhp*.8)buy(R,'heal');while(R.potions<3&&buy(R,'pot'));if(R.warps<1&&h.gold>warpCost(R)*2)buy(R,'warp');
 for(let g=0;g<20;g++){const L=shopList(R).filter(x=>['atk','def','mhp'].includes(x.id)&&!x.dis&&h.gold-x.cost>15).sort((a,b)=>a.cost-b.cost);if(!L.length)break;buy(R,L[0].id);}}
function autoRun(h){const R=newRun(h);let g=0;
 while(R.alive&&!R.won&&g++<3000){const ev=genEvent(R);const out=resolve(R,ev,aiPick(R,ev));if(!out||!R.alive)break;
  if(out.after==='shop'){enterShop(R);aiShop(R);}aiPotion(R);
  let n=0;while(R.alive&&R.farmN<(out.after==='retreat'?4:2)&&R.h.hp/R.h.mhp>.6&&n++<5){farm(R);aiPotion(R);}
  if(!R.alive)break;climb(R);}
 return R;}
function simFloors(n){const a=[];for(let i=0;i<n;i++){const R=autoRun(rollHero());a.push({f:R.won?100:R.floor,won:R.won,rank:R.h.rank});}return a;}

 if(ev.kind==='mon')return`<div class="tag">ชั้น ${f} · เผชิญหน้ามอนสเตอร์</div><h3>${esc(ev.en.n)}</h3><p>${esc(ev.en.x)}</p>${vsBox(ev.en)}`;
 if(ev.kind==='pet')return`<div class="tag">ชั้น ${f} · สัตว์เลี้ยงหลงทาง</div><h3>${esc(PETS[ev.pet].n)}</h3><p>${esc(PETS[ev.pet].x)}</p>`;
 if(ev.kind==='comp'){const c=ev.comp;return`<div class="tag">ชั้น ${f} · นักผจญภัยพเนจร</div><h3>${esc(c.n)} — ${clsName(c.cls)}</h3><p>"${R.karma<-8?'ได้ยินชื่อเสียง(ไม่ค่อยดี)ของท่านมานะ… แต่ทองก็คือทอง':'ข้าเดินคนเดียวมานานแล้ว ขอร่วมทางด้วยได้ไหม?'}" ${c.cls==='pri'?'นักบวชจะช่วยรักษาระหว่างต่อสู้':''}</p>`;}
 if(ev.kind==='boss')return`<div class="tag" style="color:var(--ember)">ชั้น ${f} · ⚠ ชั้นบอส</div><h3>${esc(ev.en.n)}</h3><p>${esc(ev.en.x)}</p>${vsBox(ev.en)}`;}
function vsBox(en){const R=S.R;return`<div class="vs"><div class="side">พลังของคุณ<br><b>${fmt(heroPower(R))}</b></div><div class="px" style="color:var(--ember)">VS</div><div class="side">พลังศัตรู<br><b>${fmt(power(en.atk,en.def,en.mhp))}</b></div></div>`;}
function renderFloor(){const cs=choicesOf(S.R,S.ev);card.innerHTML=evHeader()+chBtns(cs)+potionRow();bindChoices(pickChoice);bindPotion();}
function potionRow(){const R=S.R;return`<div class="acts"><button class="btn" id="btnPotion" ${R.potions<1||R.h.hp>=R.h.mhp-.5?'disabled':''}>ดื่มยาฟื้นพลัง (${R.potions})<span class="kb">[P]</span></button></div>`;}
function bindPotion(){const b=$('btnPotion');if(b)b.onclick=()=>{if(drink(S.R)){const o={msgs:[]};say(S.R,o,'ดื่มยาฟื้นพลัง HP +45%','good');render();}};}
function pickChoice(i){const out=resolve(S.R,S.ev,i);if(!out)return;handleOut(out);}
function handleOut(out){S.out=out;if(out.combat){S.cb={en:out.combat.en,ev:out.combat.ev,i:0,hp:out.combat.startHp,mhp:out.combat.mhp,ehp:out.combat.en.mhp,lines:[],win:out.combat.win};S.phase='combat';VIS.edead=false;render();playCombat();}else afterOut();}
function afterOut(){const out=S.out;if(out&&out.coins)coinBurst(Math.round(out.coins/8));if(S.cb&&S.cb.win)VIS.edead=true;
 if(!S.R.alive){S.phase='end';S.saved=false;render();return;}S.phase='result';render();}
let cbTimer=null;
function cbLine(e,en){const n=Math.round(e.d||0);
 if(e.t==='h')return(e.cr?'คริติคอล! ':'')+`คุณโจมตี ${n}`;if(e.t==='skill')return`ใช้สกิล! ${n} ดาเมจ`;if(e.t==='heal')return'สวดรักษาตัวเอง';if(e.t==='c')return`${e.n} โจมตี ${n}`;if(e.t==='p')return`สัตว์เลี้ยงกัด ${n}`;if(e.t==='miss')return`หลบการโจมตีได้!`;return`${en.n} โจมตี ${n}`;}
function playCombat(){clearTimeout(cbTimer);const cb=S.cb;if(!cb)return;const step=RM?0:clamp(2600/Math.max(1,cb.ev.length),60,240);
 const tick=()=>{if(S.phase!=='combat'||S.cb!==cb)return;if(cb.i>=cb.ev.length){finishCombat();return;}
  const e=cb.ev[cb.i++];cb.hp=e.hp;cb.ehp=e.ehp;cb.lines.unshift(cbLine(e,cb.en));const t=performance.now();
  if(e.t==='e'){VIS.hf=t+120;VIS.shake=t+100;VIS.nums.push({s:'-'+Math.round(e.d),x:52,y:82,c:'#ff6a5a',t0:t});}
  else if(e.d){VIS.ef=t+120;VIS.nums.push({s:(e.cr?'!':'')+Math.round(e.d),x:cb.en.boss?134:136,y:cb.en.boss?68:80,c:e.cr||e.t==='skill'?'#ffd04a':'#ffffff',t0:t});}
  updCombatUI();cbTimer=setTimeout(tick,step);};
 if(RM){cb.i=cb.ev.length;const l=cb.ev[cb.ev.length-1];if(l){cb.hp=l.hp;cb.ehp=l.ehp;}finishCombat();return;}tick();}
function finishCombat(){clearTimeout(cbTimer);afterOut();}
function renderCombat(){const cb=S.cb;card.innerHTML=`<div class="tag">ชั้น ${S.R.floor} · การต่อสู้</div><h3>ปะทะ ${esc(cb.en.n)}</h3>
 <div class="vs"><div class="side">คุณ <span class="px" id="cbH"></span><div class="hpbar"><i id="cbHB"></i></div></div><div class="px" style="color:var(--ember)">VS</div><div class="side">${esc(cb.en.n)} <span class="px" id="cbE"></span><div class="hpbar e"><i id="cbEB"></i></div></div></div>
 <ol class="blog" id="cbLog"></ol><div class="acts"><button class="btn pri" id="btnSkip" data-enter>ข้ามแอนิเมชัน<span class="kb">[Enter]</span></button></div>`;
 $('btnSkip').onclick=()=>{const l=cb.ev[cb.ev.length-1];if(l){cb.hp=l.hp;cb.ehp=l.ehp;}cb.i=cb.ev.length;finishCombat();};updCombatUI();}
function updCombatUI(){const cb=S.cb;if(!$('cbH'))return;$('cbH').textContent=`${Math.ceil(Math.max(0,cb.hp))}/${Math.round(cb.mhp)}`;$('cbHB').style.width=clamp(cb.hp/cb.mhp*100,0,100)+'%';
 $('cbE').textContent=`${Math.ceil(Math.max(0,cb.ehp))}`;$('cbEB').style.width=clamp(cb.ehp/cb.en.mhp*100,0,100)+'%';$('cbLog').innerHTML=cb.lines.slice(0,5).map(l=>`<li>${esc(l)}</li>`).join('');
 $('v-hp').textContent=`${Math.ceil(Math.max(0,cb.hp))}/${Math.round(S.R.h.mhp)}`;$('b-hp').style.width=clamp(cb.hp/S.R.h.mhp*100,0,100)+'%';}
function renderResult(){const R=S.R,out=S.out||{msgs:[],after:'result'};const toShop=out.after==='shop';
 const fm=Math.max(.25,1-.2*R.farmN);
 card.innerHTML=`<div class="tag">ชั้น ${R.floor} · ผลลัพธ์</div><h3>${toShop?'ผ่านชั้นบอสแล้ว!':out.after==='retreat'?'ถอยมาตั้งหลัก':'เหตุการณ์จบลง'}</h3>
 <ul class="msgs">${out.msgs.map(m=>`<li class="${m.c}">${esc(m.t)}</li>`).join('')||'<li>…</li>'}</ul>
 <div class="chs">
 <button class="ch pri" id="btnClimb" data-k="1" data-enter><span class="k">1</span><span><span class="t">${toShop?'เข้าศาลพักใจ ⛩':'ไต่ต่อ ▲ ชั้น '+(R.floor+1)}</span><span class="s">${toShop?'ร้านค้า · ฟื้น HP ฟรี 20%':(R.floor+1)%10===0?'<span class="b">⚠ ชั้นถัดไปคือชั้นบอส</span>':'ฟื้น HP เล็กน้อยเมื่อขึ้นชั้น'}</span></span></button>
 ${toShop?'':`<button class="ch" id="btnFarm" data-k="2"><span class="k">2</span><span><span class="t">ฟาร์มอยู่ชั้นนี้</span><span class="s"><span class="g">+EXP +ทอง (x${fm.toFixed(2)} ความเหนื่อยล้า)</span> · <span class="b">เสีย HP · ${Math.round(riskAdj(R,.1)*100)}% โดนรุม</span></span></span></button>`}
 </div>${potionRow()}`;
 $('btnClimb').onclick=()=>{if(toShop){enterShop(R);const o={msgs:[]};say(R,o,'เข้าสู่ศาลพักใจ ได้พักฟื้น HP 20%','good');S.phase='shop';render();}else doClimb();};
 const fb=$('btnFarm');if(fb)fb.onclick=()=>{const o=farm(R);handleOut(o);};bindPotion();}
function doClimb(){const R=S.R;const o=climb(R);nextEvent();}
function renderShop(){const R=S.R,L=shopList(R);
 card.innerHTML=`<div class="tag">ชั้น ${R.floor} · ศาลพักใจ</div><h3>ศาลพักใจ ⛩</h3><p>เสียงกระดิ่งลมดังแผ่วเบา นักบวชเฒ่ารับเหรียญทองแลกกับพรและเสบียง</p>
 <div class="shopg">${L.map((x,i)=>`<button class="ch" id="shop-${x.id}" data-k="${i+1}" ${x.dis?'disabled':''}><span class="k">${i+1}</span><span><span class="t">${esc(x.n)}</span><span class="s"><span class="w px">${fmt(x.cost)}</span> ทอง · ${esc(x.d)}</span></span></button>`).join('')}</div>
 <div class="acts"><button class="btn pri" id="btnLeave" data-enter>ออกจากศาล ไต่ต่อ ▲<span class="kb">[Enter]</span></button></div>`;
 L.forEach(x=>{const b=$('shop-'+x.id);b.onclick=()=>{if(buy(R,x.id)){const o={msgs:[]};say(R,o,`ซื้อ ${x.n}`,'good');render();}};});
 $('btnLeave').onclick=doClimb;}
const MAPC={fight:'#c0503a',treasure:'#e8b840',trap:'#8a4ab0',good:'#5fc06a',evil:'#6a1a2a',pet:'#ea9bbd',comp:'#4fa6e0',boss:'#ff8a2a',warp:'#7ae8f0',flee:'#8a9aa0',calm:'#4a5a60',bad:'#8a6a4a',farm:'#2a6a5a',death:'#f1e7d0'};
const MAPN={fight:'ต่อสู้',treasure:'สมบัติ',trap:'กับดัก/บาดเจ็บ',good:'กรรมดี',evil:'กรรมชั่ว',pet:'สัตว์เลี้ยง',comp:'เพื่อน',boss:'บอส',warp:'วาร์ป',flee:'หนี',calm:'สงบ',bad:'โชคร้าย',death:'จุดจบ'};
function judge(k){if(k>=25)return'วิญญาณบริสุทธิ์ เทพธิดาแห่งหอคอยโปรยดอกไม้ส่งคุณสู่สวรรค์';if(k>=10)return'คนดีที่โลกจะจดจำ ชาวบ้านจุดเทียนให้คุณทุกปี';if(k>=-5)return'ไม่ดีไม่ชั่ว เป็นแค่อีกหนึ่งชื่อบนแผ่นหิน';if(k>=-20)return'ทิ้งหนี้กรรมไว้ไม่น้อย วิญญาณต้องชดใช้อีกสักพัก';return'ดวงวิญญาณดำมืด ปีศาจในหอคอยยืนรอต้อนรับคุณอยู่';}
function renderEnd(){const R=S.R,h=R.h,C=CLASSES[h.cls],won=R.won,fl=won?100:R.floor;
 if(!S.saved){S.saved=true;saveMemo({name:h.name,rank:h.rank,cls:C.n,floor:fl,won,cause:won?'พิชิตยอดหอคอย':R.cause,lv:h.lv,t:Date.now()});}
 if(!S.cmp){setTimeout(()=>{if(S.phase!=='end'||S.cmp)return;S.cmp=simFloors(160).map(x=>x.f);renderEnd();save();},40);}
 const cells=R.map.map((m,i)=>`<span class="${(i+1)%10===0?'boss ':''}${R.farmed[i]?'farm':''}" style="${m?`background:${MAPC[m]}`:i<fl?'background:#2a3a40':''}" title="ชั้น ${i+1}${m?' · '+(MAPN[m]||'ฟาร์ม'):''}${R.farmed[i]?' · ฟาร์ม '+R.farmed[i]+' ครั้ง':''}"></span>`).join('');
 let cmpH='<p class="dim" style="font-size:13px">กำลังจำลองนักผจญภัย 160 คน…</p>';
 if(S.cmp){const a=S.cmp,below=a.filter(x=>x<fl).length,eq=a.filter(x=>x===fl).length,pct=Math.round((below+eq/2)/a.length*100);
  const bins=Array(10).fill(0);a.forEach(x=>bins[clamp(Math.floor((x-1)/10),0,9)]++);const mb=Math.max(...bins),my=clamp(Math.floor((fl-1)/10),0,9);
  const med=[...a].sort((x,y)=>x-y)[80];
  cmpH=`<p style="font-size:14px;margin:4px 0">คุณไปได้ไกลกว่า <b class="px" style="color:var(--gold);font-size:18px">${pct}%</b> ของนักผจญภัยจำลอง · ค่ากลาง ชั้น ${med} · ถึงยอด ${a.filter(x=>x>=100).length} คน</p>
  <div class="hist">${bins.map((v,i)=>`<div class="c ${i===my?'me':''}">${i===my?'<span class="me-tag">คุณ</span>':''}<i style="height:${v/mb*100}%"></i></div>`).join('')}</div>
  <div class="hlab">${bins.map((v,i)=>`<span>${i*10+1}</span>`).join('')}</div>`;}
 card.innerHTML=`<div class="epi"><div class="tag">${won?'ตำนานบทใหม่':'แผ่นจารึกหน้าหลุมศพ'}</div><div class="big">${won?'👑 ':'✝ '}${esc(h.name)}</div>
 <dl class="kv"><dt>แรงค์/อาชีพ</dt><dd>${RANKS[h.rank].k} · ${C.n} (1 ใน ${fmt(h.odds)})</dd><dt>ชั้นที่ไปถึง</dt><dd class="px">${fl} / 100</dd><dt>เลเวล</dt><dd class="px">${h.lv}</dd>
 <dt>${won?'ผลลัพธ์':'สาเหตุการตาย'}</dt><dd>${esc(won?'พิชิตผู้กลืนดาราและยืนบนยอดหอคอย':R.cause)}</dd><dt>ทองที่ทิ้งไว้</dt><dd class="px">${fmt(h.gold)}</dd>
 <dt>ปาร์ตี้</dt><dd>${[...R.pets.map(p=>PETS[p].n),...R.comps.map(c=>c.n+' ('+clsName(c.cls)+')')].join(', ')||'เดินทางคนเดียว'}</dd>
 <dt>กรรม</dt><dd class="px" style="color:var(--karma)">${R.karma>0?'+':''}${R.karma} ${R.karma>=0?'กรรมดี':'กรรมชั่ว'}</dd></dl>
 <div class="judge">${judge(R.karma)}</div></div>
 <h2>แผนที่การไต่หอ</h2><div class="grid100">${cells}</div>
 <div class="legend">${Object.keys(MAPN).map(k=>`<span><i style="background:${MAPC[k]}"></i>${MAPN[k]}</span>`).join('')}<span><i style="background:#2a6a5a"></i>จุดเขียว = ฟาร์ม</span></div>
 <h2 style="margin-top:12px">เทียบกับนักผจญภัยจำลอง 160 คน</h2>${cmpH}
 <div class="acts"><button class="btn pri" id="btnReborn" data-enter>เกิดใหม่ ↻<span class="kb">[Enter]</span></button></div>`;
 $('btnReborn').onclick=newBirth;renderMemo();if(document.activeElement===document.body||!document.activeElement)focusPrimary();}
function newBirth(){S={v:1,phase:'birth',hero:rollHero(),rerolled:false,R:null,ev:null,out:null,cb:null,cmp:null,saved:false,runId:0};snap=null;VIS.coins=[];render();}
function save(){}
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key;
 if(/^[1-9]$/.test(k)){const b=card.querySelector(`button[data-k="${k}"]`);if(b&&!b.disabled){e.preventDefault();b.click();}}
 else if(k==='Enter'){if(document.activeElement&&document.activeElement.tagName==='BUTTON')return;const b=card.querySelector('[data-enter]');if(b&&!b.disabled){e.preventDefault();b.click();}}
 else if(k==='f'||k==='F'){const b=$('btnFarm');if(b&&!b.disabled)b.click();}
 else if(k==='p'||k==='P'){const b=$('btnPotion');if(b&&!b.disabled)b.click();}});
document.querySelectorAll('canvas.ico').forEach(c=>{const s=ICONS[c.dataset.ico];if(s)c.getContext('2d').drawImage(sprCanvas(s,false,false,'i'+c.dataset.ico),0,0);});
function start(data){let st=data&&data.state;
 if(st&&st.v===1&&st.hero){S=st;if(S.phase==='combat'){S.phase=S.R&&S.R.alive?'result':'end';}renderMemo();render();}
 else{renderMemo();newBirth();}
 requestAnimationFrame(loop);}
try{window.claude?.hot?.snapshot?.(()=>({state:S}));}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
