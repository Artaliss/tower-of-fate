<title>หอคอยโชคชะตา</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;
--bg:#0b1215;--bg2:#101b20;--panel:#15232a;--panel2:#1c2e36;--line:#2c434d;--line2:#3d5a66;
--ink:#f1e7d0;--muted:#a3b5ad;--dim:#6f857e;--gold:#f4bb4a;--gold2:#b97a22;--ember:#e86a3a;
--hp:#e0574b;--mp:#4fa6e0;--exp:#86cf6a;--luk:#5fd0a6;--atk:#f08a4b;--def:#a9bfd0;
--good:#86d67f;--bad:#ef6b5e;--warn:#f2c14e;--karma:#d7b8f0;--focus:#ffd76a;
--parch:#eadbb4;--parch2:#d4bf8c;--pink:#ea9bbd;
--fT:'Mitr','Kanit','Noto Sans Thai',system-ui,sans-serif;
--fP:'Pixelify Sans','Silkscreen','Mitr',monospace;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--fT);font-weight:300;line-height:1.5;
background:radial-gradient(ellipse 80% 40% at 50% -5%,#2a2416 0%,transparent 70%),var(--bg);min-height:100vh;overflow-x:hidden}
.wrap{max-width:1120px;margin:0 auto;padding-block:14px 28px;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.px{font-family:var(--fP);font-weight:600;letter-spacing:.02em}
h2{font-size:15px;font-weight:500;margin:0 0 8px;color:var(--gold)}
button{font-family:var(--fT);color:var(--ink);cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--panel);border:2px solid var(--line);
box-shadow:0 0 0 2px #070c0e,inset 0 2px 0 #24383f;padding:8px 12px;border-radius:4px}
.who{min-width:0;flex:1 1 180px}
.who .nm{font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .sub{font-size:12px;color:var(--muted)}
.flr{display:flex;align-items:baseline;gap:4px}
.flr .lbl{font-size:13px;color:var(--muted)}
.flr .big{font-size:26px;color:var(--gold)}
.dim{color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:3 1 420px}
.chip{position:relative;display:flex;align-items:center;gap:5px;background:var(--bg2);border:1px solid var(--line);padding:3px 7px;border-radius:3px;min-width:0}
.chip .v{font-size:13px}
.chip .bar{display:block;width:44px;height:5px;background:#0a0f11;border:1px solid #2a3a40}
.chip .bar i{display:block;height:100%;width:0;transition:width .3s}
#b-hp{background:var(--hp)}#b-mp{background:var(--mp)}#b-lv{background:var(--exp)}
canvas.ico{width:16px;height:16px;image-rendering:pixelated;flex:none}
.flt{position:absolute;left:50%;top:-4px;transform:translateX(-50%);font-family:var(--fP);font-size:12px;font-weight:700;pointer-events:none;white-space:nowrap;animation:flt 1.2s ease-out forwards;text-shadow:0 1px 0 #000}
.flt.up{color:var(--good)}.flt.dn{color:var(--bad)}
@keyframes flt{0%{opacity:0;transform:translate(-50%,4px)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-22px)}}
.prog{margin:10px 0}
.track{position:relative;height:14px;background:var(--bg2);border:2px solid var(--line);border-radius:2px}
.track .fill{position:absolute;inset:0 auto 0 0;width:0;background:repeating-linear-gradient(90deg,var(--gold2) 0 4px,var(--gold) 4px 8px);transition:width .4s}
.tick{position:absolute;top:-4px;width:2px;height:18px;background:var(--ember);transform:translateX(-1px)}
.tick.done{background:var(--good)}
.mark{position:absolute;top:-9px;width:10px;height:10px;background:var(--ink);transform:translateX(-5px) rotate(45deg);border:2px solid #000;transition:left .4s}
.prog .lg{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:3px}
.main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px;align-items:start}
.sceneBox{position:relative;background:#05080a;border:2px solid var(--line);box-shadow:0 0 0 2px #070c0e;border-radius:4px;overflow:hidden}
#scene{display:block;width:100%;aspect-ratio:3/2;image-rendering:pixelated;image-rendering:crisp-edges}
.biome{position:absolute;left:8px;top:8px;font-size:12px;background:#000a;padding:2px 8px;border-radius:2px;color:var(--gold)}
.card{background:var(--panel);border:2px solid var(--line);box-shadow:0 0 0 2px #070c0e,inset 0 2px 0 #24383f;border-radius:4px;padding:14px;min-height:200px}
.card h3{margin:0 0 4px;font-size:19px;font-weight:500;color:var(--gold)}
.card .tag{font-size:12px;color:var(--muted);margin-bottom:6px}
.card p{margin:6px 0 12px;color:var(--ink);font-size:14px}
.chs{display:flex;flex-direction:column;gap:7px}
.ch{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--panel2);border:2px solid var(--line2);border-radius:3px;padding:8px 10px;font-size:14px;transition:background .15s,border-color .15s}
.ch:hover:not(:disabled){background:#243a44;border-color:var(--gold2)}
.ch:disabled{opacity:.45;cursor:not-allowed}
.ch .k{flex:none;font-family:var(--fP);font-weight:700;background:var(--gold);color:#1a1206;width:22px;height:22px;display:grid;place-items:center;border-radius:2px;font-size:13px;margin-top:1px}
.ch .t{font-weight:500}
.ch .s{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.ch.pri{border-color:var(--gold2);background:#2a2a1c}
.g{color:var(--good)}.b{color:var(--bad)}.w{color:var(--warn)}.kk{color:var(--karma)}
.msgs{list-style:none;margin:6px 0 12px;padding:0;font-size:14px}
.msgs li{padding:3px 0;border-bottom:1px dashed #2a3e46}
.msgs li.good{color:var(--good)}.msgs li.bad{color:var(--bad)}.msgs li.lv{color:var(--gold)}.msgs li.info{color:var(--ink)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:8px 0}
.vs .side{background:var(--bg2);border:1px solid var(--line);padding:6px 8px;border-radius:3px;font-size:13px}
.vs .side b{font-family:var(--fP);font-size:18px;color:var(--gold)}
.hpbar{height:8px;background:#0a0f11;border:1px solid #2a3a40;margin-top:4px}
.hpbar i{display:block;height:100%;background:var(--hp);transition:width .15s}
.hpbar.e i{background:var(--ember)}
.blog{font-size:12px;color:var(--muted);min-height:70px;margin:6px 0 10px;list-style:none;padding:0}
.blog li:first-child{color:var(--ink)}
.cert{background:var(--parch);color:#33240f;border-radius:3px;padding:12px 14px;box-shadow:inset 0 0 0 3px var(--parch2),inset 0 0 0 5px #8b6a3a;position:relative}
.cert .hd{text-align:center;font-weight:600;letter-spacing:.04em;color:#6b3f12;font-size:14px;border-bottom:2px dashed #a8874f;padding-bottom:4px}
.cert .nm{text-align:center;font-size:24px;font-weight:600;margin:6px 0 0}
.cert .vil{text-align:center;font-size:13px;color:#6b5634}
.badges{display:flex;justify-content:center;gap:6px;margin:8px 0;flex-wrap:wrap}
.rk{font-family:var(--fP);font-weight:700;padding:1px 10px;border-radius:2px;color:#111;font-size:16px;border:2px solid #0004}
.cls{background:#3a2a14;color:var(--parch);padding:2px 10px;border-radius:2px;font-size:14px}
.cert .pas{font-size:12.5px;text-align:center;color:#4a3518}
.cstats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:8px 0;font-size:13px}
.cstats div{background:#d9c79a;padding:2px 6px;border-radius:2px;display:flex;justify-content:space-between}
.cstats b{font-family:var(--fP)}
.odds{text-align:center;font-size:15px;margin:4px 0}
.odds b{font-family:var(--fP);font-size:20px;color:#8a2a12}
.rchart{display:flex;align-items:flex-end;gap:4px;height:84px;margin:16px 4px 2px;border-bottom:2px solid #6b5634;position:relative}
.rchart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.rchart .bar{width:100%;background:repeating-linear-gradient(0deg,#9c8455 0 3px,#8a7346 3px 6px)}
.rchart .col.me .bar{background:repeating-linear-gradient(0deg,#c2411f 0 3px,#a8341a 3px 6px)}
.rchart .me-tag{position:absolute;top:-17px;font-size:11px;background:#a8341a;color:#fff;padding:0 4px;border-radius:2px;white-space:nowrap}
.rlab{display:flex;gap:4px;margin:0 4px}
.rlab span{flex:1;text-align:center;font-family:var(--fP);font-size:12px}
.cert .foot{text-align:center;font-size:12px;color:#6b5634;margin-top:4px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{flex:1 1 140px;background:var(--panel2);border:2px solid var(--line2);border-radius:3px;padding:9px 12px;font-size:14px;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--gold2)}
.btn.pri{background:var(--gold);color:#1a1206;border-color:#7a5214}
.btn.pri:hover:not(:disabled){background:#ffd06a}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .kb{font-family:var(--fP);font-size:11px;opacity:.7;margin-left:4px}
.lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:12px;margin-top:12px}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:4px;padding:10px 12px;min-width:0}
.mem{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed #2a3e46;font-size:13px}
.mem canvas{width:32px;height:32px;image-rendering:pixelated;background:var(--bg2);border:1px solid var(--line);flex:none}
.mem .d{color:var(--muted);font-size:12px}
.inv{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
.inv b{color:var(--ink);font-family:var(--fP)}
#log{list-style:none;margin:0;padding:0;max-height:220px;overflow:auto;font-size:13px}
#log li{padding:2px 0;border-bottom:1px solid #1d2d33;display:flex;gap:8px}
#log li .f{font-family:var(--fP);color:var(--dim);flex:none;width:34px}
#log li.good{color:var(--good)}#log li.bad{color:var(--bad)}#log li.lv{color:var(--gold)}
.memo{margin-top:12px}
.memo .row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;font-size:13px;padding:4px 0;border-bottom:1px dashed #2a3e46}
.memo .row .x{color:var(--muted);font-size:12px}
.keys{margin-top:10px;text-align:center;font-size:12px;color:var(--dim)}
.grid100{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;margin:6px 0}
.grid100 span{aspect-ratio:1;border-radius:1px;background:#1a262b;position:relative}
.grid100 span.boss{box-shadow:inset 0 0 0 1px var(--ember)}
.grid100 span.farm::after{content:"";position:absolute;right:1px;bottom:1px;width:3px;height:3px;background:#5fd0a6}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;margin-right:3px;vertical-align:-1px}
.hist{display:flex;align-items:flex-end;gap:3px;height:80px;margin-top:18px;border-bottom:2px solid var(--line2)}
.hist .c{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;position:relative}
.hist .c i{display:block;background:var(--line2)}
.hist .c.me i{background:var(--gold)}
.hist .c .me-tag{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:11px;background:var(--gold);color:#1a1206;padding:0 4px;border-radius:2px;white-space:nowrap}
.hlab{display:flex;gap:3px;font-family:var(--fP);font-size:10px;color:var(--dim)}
.hlab span{flex:1;text-align:center}
.epi{border:2px solid var(--line2);background:var(--bg2);padding:10px;border-radius:3px;margin-bottom:10px}
.epi .big{font-size:22px;font-weight:600;color:var(--gold)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.judge{margin:8px 0;padding:8px;border-left:3px solid var(--karma);background:#1b1a24;font-size:14px}
.shopg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media (max-width:700px){
 .main,.lower{grid-template-columns:minmax(0,1fr)}
 .chips{flex-basis:100%}
 .chip .bar{width:30px}
 .shopg{grid-template-columns:1fr}
 .card{padding:12px}
}
.mute{flex:none;background:var(--bg2);border:1px solid var(--line);border-radius:3px;padding:2px 9px;font-size:15px;line-height:1.3;color:var(--gold)}
.mute[aria-pressed="true"]{color:var(--dim);text-decoration:line-through}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
 <header class="hud" aria-label="สถานะนักผจญภัย">
  <div class="who"><div class="nm" id="hName">—</div><div class="sub" id="hSub"></div></div>
  <div class="flr"><span class="lbl">ชั้น</span><span class="px big" id="hFloor">0</span><span class="px dim">/100</span></div>
  <div class="chips">
   <div class="chip" id="c-hp" title="พลังชีวิต"><canvas class="ico" data-ico="heart" width="8" height="8"></canvas><span class="px v" id="v-hp"></span><span class="bar"><i id="b-hp"></i></span></div>
   <div class="chip" id="c-atk" title="พลังโจมตี"><canvas class="ico" data-ico="sword" width="8" height="8"></canvas><span class="px v" id="v-atk"></span></div>
   <div class="chip" id="c-def" title="พลังป้องกัน"><canvas class="ico" data-ico="shield" width="8" height="8"></canvas><span class="px v" id="v-def"></span></div>
   <div class="chip" id="c-luk" title="โชค"><canvas class="ico" data-ico="clover" width="8" height="8"></canvas><span class="px v" id="v-luk"></span></div>
   <div class="chip" id="c-mp" title="มานา"><canvas class="ico" data-ico="drop" width="8" height="8"></canvas><span class="px v" id="v-mp"></span><span class="bar"><i id="b-mp"></i></span></div>
   <div class="chip" id="c-lv" title="เลเวล / EXP"><canvas class="ico" data-ico="star" width="8" height="8"></canvas><span class="px v" id="v-lv"></span><span class="bar"><i id="b-lv"></i></span></div>
   <div class="chip" id="c-gold" title="เหรียญทอง"><canvas class="ico" data-ico="coin" width="8" height="8"></canvas><span class="px v" id="v-gold"></span></div>
  </div>
  <button class="mute" id="btnMute" type="button" aria-label="เปิด/ปิดเสียง" aria-pressed="true" title="เปิด/ปิดเสียง">♪</button>
 </header>
 <div class="prog"><div class="track" role="progressbar" aria-label="ความคืบหน้าหอคอย" aria-valuemin="0" aria-valuemax="100" id="track"><div class="fill" id="pFill"></div><div id="pTicks"></div><div class="mark" id="pMark"></div></div>
  <div class="lg"><span class="px">1</span><span>ขีดแดง = ชั้นบอส</span><span class="px">100</span></div></div>
 <main class="main">
  <section class="sceneBox"><canvas id="scene" width="192" height="128" aria-label="ฉากในหอคอย"></canvas><div class="biome" id="biomeTag"></div></section>
  <section class="card" id="card" aria-live="polite"></section>
 </main>
 <section class="lower">
  <div class="panel"><h2>ปาร์ตี้</h2><div id="party"></div></div>
  <div class="panel"><h2>บันทึกการผจญภัย</h2><ol id="log"></ol></div>
 </section>
 <section class="panel memo"><h2>สุสานนักผจญภัย</h2><div id="memo"></div></section>
 <footer class="keys">ปุ่มลัด: 1–9 เลือก · Enter ดำเนินต่อ · F ฟาร์ม · P ดื่มยา</footer>
</div>

<script src="sprites.js"></script>
<script src="events.js"></script>
<script src="audio.js"></script>
<script src="engine.js"></script>
